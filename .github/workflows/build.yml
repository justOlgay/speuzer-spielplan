name: Spielplan-Kalender bauen

on:
  push:
    branches: [main]
    paths: ["spiele.csv", "build_ics.py", ".github/workflows/build.yml"]
  schedule:
    - cron: "12 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ICS-Dateien erzeugen
        env:
          SEQ: ${{ github.run_number }}
        run: python3 build_ics.py

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Keine Aenderung."
          else
            git commit -m "Spielplan-Kalender neu gebaut (Lauf ${{ github.run_number }})"
            git push
          fi
